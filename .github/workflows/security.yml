name: Security Check

on: [push]

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install bandit
        run: pip install bandit==1.8.3

      - name: Run Bandit SAST
        run: bandit -r src -ll
