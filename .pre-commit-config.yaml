repos:
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: pip-audit
        language: system
        args: ["-r", "requirements.txt"]
        files: requirements.txt
      - id: bandit
        name: bandit
        entry: bandit
        language: system
        args: ["-r", "src", "-ll"]
        files: \.py$
 
